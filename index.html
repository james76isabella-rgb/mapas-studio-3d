<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAPAS STUDIO</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#09251d;color:white;font:15px system-ui}header{height:55px;padding:14px;background:#0b3427;font-weight:800}#map{height:62dvh;background:#183d47}main{padding:12px}select,button{background:#17543b;color:white;border:1px solid #4d9975;border-radius:10px;padding:12px;font:inherit}button{cursor:pointer}select{width:55%}.row{display:flex;gap:8px;margin:8px 0}.row button{flex:1}#status{font-size:12px;color:#b1e5c6;padding:8px 0}small{color:#9ec8b0}</style></head><body><header>🌎 MAPAS STUDIO · SATÉLITE</header><div id="map"></div><main><div id="status">Iniciando mapa…</div><div class="row"><select id="country"><option value="COL">🇨🇴 Colombia</option><option value="ECU">🇪🇨 Ecuador</option><option value="VEN">🇻🇪 Venezuela</option><option value="PER">🇵🇪 Perú</option><option value="BRA">🇧🇷 Brasil</option><option value="ARG">🇦🇷 Argentina</option><option value="BOL">🇧🇴 Bolivia</option><option value="CHL">🇨🇱 Chile</option><option value="PRY">🇵🇾 Paraguay</option><option value="URY">🇺🇾 Uruguay</option><option value="GUY">🇬🇾 Guyana</option><option value="SUR">🇸🇷 Surinam</option></select><button id="focus">Enfocar país</button></div><div class="row"><button id="flag">Relleno: ON</button><button id="border">Frontera: ON</button><button id="perspective">Perspectiva 3D</button></div><small>Versión inicial para Android. Requiere Internet. El efecto 3D es visual, no relieve topográfico. El relleno usa un color representativo, no la bandera completa.</small></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const status=document.getElementById('status');function say(s){status.textContent=s}if(!window.L){say('Error: no se cargó la biblioteca del mapa.');throw Error('Leaflet unavailable')}
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([-10,-65],4);const tiles=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(map);tiles.on('load',()=>{if(!data)say('Satélite cargado; esperando fronteras…')});tiles.on('tileerror',()=>say('Error de red cargando satélite'));
let data=null,selected='COL',flag=true,border=true,overlay=null;
const colors={COL:'#fcd116',ECU:'#fdd116',VEN:'#ffcc00',PER:'#d91023',BRA:'#159447',ARG:'#75b2dd',BOL:'#d52b1e',CHL:'#d52b1e',PRY:'#d52b1e',URY:'#75b2dd',GUY:'#009e49',SUR:'#377e3f'};
function feature(){return data?.features.find(f=>(f.properties?.['ISO3166-1-Alpha-3']||f.properties?.iso_a3||f.properties?.ISO_A3)===selected)}
function draw(){if(overlay)map.removeLayer(overlay);const f=feature();if(!f)return;overlay=L.geoJSON(f,{style:{color:border?'#ffffff':'transparent',weight:border?3:0,fillColor:colors[selected],fillOpacity:flag?.68:0}}).addTo(map)}
function focus(){const f=feature();if(!f){say('Fronteras todavía no disponibles');return}draw();map.fitBounds(L.geoJSON(f).getBounds(),{padding:[24,24],maxZoom:7});say('País seleccionado: '+document.querySelector('#country option:checked').textContent)}
document.getElementById('country').onchange=e=>{selected=e.target.value;focus()};document.getElementById('focus').onclick=focus;document.getElementById('flag').onclick=()=>{flag=!flag;document.getElementById('flag').textContent='Relleno: '+(flag?'ON':'OFF');draw()};document.getElementById('border').onclick=()=>{border=!border;document.getElementById('border').textContent='Frontera: '+(border?'ON':'OFF');draw()};document.getElementById('perspective').onclick=()=>{const el=document.getElementById('map');el.style.transform=el.style.transform?'':'perspective(1100px) rotateX(9deg) scale(1.04)';map.invalidateSize()};
fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(j=>{data=j;focus()}).catch(e=>{say('No se pudieron cargar fronteras: '+e.message);console.error(e)});
</script></body></html>
